<!doctype html>
<html lang="is">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hjartaheimar</title>
  <meta name="description" content="Hjartaheimar — rými fyrir jóga, öndun, djúpslökun, vatnsmeðferð og innri vinnu. Vefurinn er í vinnslu.">
  <link rel="icon" href="img/hjartaheimar-icon-round.png">
  <meta property="og:title" content="Hjartaheimar">
  <meta property="og:description" content="Rými fyrir jóga, öndun, djúpslökun, vatnsmeðferð og innri vinnu.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="is_IS">
  <meta property="og:url" content="https://hjartaheimar.is">
  <meta property="og:image" content="https://hjartaheimar.is/img/gudlaug-sound-healing.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root{
      --background:#F3EDE4;
      --text-primary:#2B2B2B;
      --text-secondary:#6B5D52;
      --accent:#5B1F1F;
      --accent-soft:#C56D5B;
      --border:#D8C1A6;
    }
    *{box-sizing:border-box;}
    html,body{margin:0;}
    body{
      background:var(--background);
      color:var(--text-primary);
      font-family:'Montserrat',sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    .hero{
      position:relative;
      height:72vh;
      min-height:420px;
      max-height:760px;
      overflow:hidden;
    }
    .hero img.photo{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      object-position:center 30%;
    }
    .hero .fade{
      position:absolute;
      left:0; right:0; bottom:0; height:14%;
      background:linear-gradient(to top, var(--background), rgba(243,237,228,0));
    }

    .content{
      max-width:640px;
      margin:0 auto;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:1.3rem;
      padding:3.75rem 1.5rem 0;
      text-align:center;
    }
    .content img.logo{
      width:min(280px, 58vw);
      height:auto;
    }
    .areas{
      font-size:.72rem;
      letter-spacing:.2em;
      text-transform:uppercase;
      color:var(--text-secondary);
      margin:0;
    }

    main{
      max-width:640px;
      margin:0 auto;
      padding:2.25rem 1.5rem 4.5rem;
      text-align:center;
    }
    main p{
      font-size:1.02rem;
      line-height:1.8;
      color:var(--text-secondary);
      margin:0;
    }

    footer{
      text-align:center;
      padding:0 1.5rem 3rem;
      font-size:.72rem;
      letter-spacing:.05em;
      color:var(--text-secondary);
      opacity:.75;
    }

    @media (max-width:560px){
      .hero{ height:52vh; min-height:340px; }
      .content{ padding-top:3rem; }
    }
  </style>
</head>
<body>

  <div class="hero">
    <img class="photo" src="img/gudlaug-sound-healing.jpg" alt="Guðlaug Ósk Pétursdóttir í hljóðheilun, umkringd hljóðskálum og hljóðfærum">
    <div class="fade"></div>
  </div>

  <div class="content">
    <img class="logo" src="img/hjartaheimar-logo.png" alt="Hjartaheimar — Mættu þér eins og þú ert">
    <p class="areas">Jóga &nbsp;·&nbsp; Öndun &nbsp;·&nbsp; Djúpslökun &nbsp;·&nbsp; Vatnsmeðferð &nbsp;·&nbsp; Heilun</p>
  </div>

  <main>
    <p>Hjartaheimar er að taka á sig mynd — rými fyrir jóga, öndun, djúpslökun og innri vinnu. Meira á leiðinni.</p>
  </main>

  <footer>&copy; 2026 Hjartaheimar</footer>

</body>
</html>
