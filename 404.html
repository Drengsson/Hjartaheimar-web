<!DOCTYPE html>
<html lang="is">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Síðan fannst ekki — Hjartaheimar</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preload" href="fonts/Fraunces-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/Karla-Variable.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{
    font-family:'Fraunces';
    src:url('fonts/Fraunces-Variable.woff2') format('woff2');
    font-weight:100 900;
    font-style:normal;
    font-display:swap;
  }
  @font-face{
    font-family:'Karla';
    src:url('fonts/Karla-Variable.woff2') format('woff2');
    font-weight:200 800;
    font-style:normal;
    font-display:swap;
  }
  :root{
    --ground:#ece4d6; --surface:#f8f3e9; --ink:#2a1d16; --ink-soft:#5c4c3f;
    --ink-faint:#8a7a6a; --brand:#5b1f1f; --brand-2:#7c3626; --line:#2a1d1624;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#191310; --surface:#251d17; --ink:#ede2d3; --ink-soft:#c6b7a4;
      --ink-faint:#958473; --brand:#e0a58d; --brand-2:#eabca3; --line:#ffffff24;
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--ground); color:var(--ink);
    font:400 1rem/1.7 'Karla',sans-serif; -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; text-align:center;
  }
  .wrap{max-width:480px; padding:clamp(32px,8vw,64px) clamp(20px,5vw,40px);}
  .eyebrow{
    font-size:0.8rem; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--ink-faint); margin:0 0 14px;
  }
  h1{
    font-family:'Fraunces',serif; font-weight:600; font-size:clamp(2.2rem,6vw,3.2rem);
    color:var(--brand); margin:0 0 16px; text-wrap:balance;
  }
  p{margin:0 0 32px; color:var(--ink-soft); max-width:40ch; margin-left:auto; margin-right:auto;}
  .home-link{
    display:inline-block; padding:14px 28px; background:var(--brand); color:var(--surface);
    text-decoration:none; font-size:0.95rem; border:1px solid var(--brand); border-radius:2px;
    transition:filter 0.15s ease;
  }
  .home-link:hover, .home-link:focus-visible{filter:brightness(0.9);}
  .home-link:focus-visible{outline:2px solid var(--brand-2); outline-offset:3px;}
  @media (prefers-reduced-motion: reduce){ *{transition-duration:0.001ms !important;} }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow">Hjartaheimar</p>
    <h1>Síðan fannst ekki</h1>
    <p>Slóðin sem þú fylgdir er ekki lengur til, eða var aldrei til. Farðu aftur á forsíðuna til að finna það sem þú leitar að.</p>
    <a class="home-link" href="/">Til baka á forsíðuna</a>
  </div>
</body>
</html>
